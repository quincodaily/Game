<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130a18">
<title>Monsterhaven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed canvas world (pan/zoom), a fixed top HUD, a floating quest tracker, a bottom tab bar,
   and a sliding sheet panel for all management screens. Single committed dark-fantasy look, no theme toggle. */
:root {
  --ink: #0b0710; --bg: #130a18; --panel: #231132; --panel-2: #2f1a42; --panel-lo: #170c22;
  --cream: #efe3f0; --muted: #a890b8; --gold: #f2b53c; --gold-hi: #ffd978; --gold-lo: #a8701a;
  --good: #7fcf5a; --bad: #e0553f; --accent: #8a4fd0; --accent-hi: #b07aff;
  --food: #e0553f; --wood: #d9a766; --stone: #aab2bf; --iron: #9db4d0; --essence: #c58cf0; --goldc: #f2c14e;
  --f-px: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body: "VT323", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--cream);
  font-family: var(--f-body); font-size: 20px; line-height: 1.15;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
h2, h3, h4 { font-family: var(--f-px); font-weight: 400; margin: 0; }
p { margin: 0 0 6px; }

#gameCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #06040e; touch-action: none; }

.pbtn { font-family: var(--f-px); font-size: 10px; line-height: 1.5; color: var(--cream); background: var(--panel-2); padding: 10px 12px; box-shadow: 0 0 0 2px var(--ink), inset 2px 2px 0 #432a5c, inset -2px -2px 0 var(--panel-lo); text-transform: uppercase; text-align: center; }
.pbtn.go { background: var(--gold); color: #2b1a05; box-shadow: 0 0 0 2px var(--ink), inset 2px 2px 0 var(--gold-hi), inset -2px -2px 0 var(--gold-lo); }
.pbtn.dark { background: var(--panel-lo); }
.pbtn.danger { background: #8f2f26; color: #fff; box-shadow: 0 0 0 2px var(--ink), inset 2px 2px 0 #c24a3a, inset -2px -2px 0 #5e1d17; }
.pbtn.sm { font-size: 8px; padding: 7px 9px; }
.pbtn:disabled { filter: grayscale(.6) brightness(.6); cursor: not-allowed; }
.pbtn:not(:disabled):active { transform: translateY(1px); }

/* HUD */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); pointer-events: none; }
#hud::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--panel-lo); z-index: -1; }
.hudbar { display: flex; align-items: center; gap: 8px; background: var(--panel); box-shadow: 0 0 0 2px var(--ink), inset 2px 2px 0 #432a5c, inset -2px -2px 0 var(--panel-lo); padding: 6px 8px; pointer-events: auto; flex-wrap: wrap; }
#hud-res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; flex: 1; min-width: 0; }
.rchip { display: flex; align-items: center; gap: 4px; padding: 3px 5px; min-width: 0; flex: none; background: var(--panel-lo); box-shadow: 0 0 0 1px var(--ink); }
.rchip img { flex: none; }
.rchip.full .rv { color: var(--bad); }
.rv { font-variant-numeric: tabular-nums; font-size: 17px; }
.rs { font-size: 12px; white-space: nowrap; }
.odds { font-size: 17px; margin: 4px 0 8px; font-weight: 700; }
.odds.hi { color: var(--good); } .odds.mid { color: var(--gold-hi); } .odds.lo { color: var(--bad); }
.sheetgap .pbtn, #sheetBody > .pbtn { margin-top: 6px; }
.stack > .pbtn { width: 100%; }
.rs.pos { color: var(--good); } .rs.neg { color: var(--bad); }
.hudinfo { display: flex; gap: 4px 10px; align-items: center; font-size: 15px; color: var(--muted); padding: 2px 2px 0; flex-wrap: wrap; width: 100%; }
.hudrow { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.hudinfo b { color: var(--cream); }
.warnText { color: var(--bad); font-weight: 700; }
#hud-castle { font-family: var(--f-px); font-size: 10px; color: var(--gold-hi); }
.pop.full { color: var(--bad); }
.hudctrl { display: flex; gap: 6px; pointer-events: auto; }
.iconbtn { width: 32px; height: 30px; display: grid; place-items: center; background: var(--panel-2); box-shadow: 0 0 0 2px var(--ink), inset 2px 2px 0 #432a5c, inset -2px -2px 0 var(--panel-lo); font-family: var(--f-px); font-size: 10px; }
.iconbtn[aria-pressed="true"] { background: var(--gold); color: #2b1a05; }
#speedRow { display: flex; gap: 4px; pointer-events: auto; }

/* quest tracker */
#questMini { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(68px + max(10px, env(safe-area-inset-bottom, 0px))); width: min(240px, 60vw); z-index: 15; display: flex; flex-direction: column; gap: 4px; }
.qrow { background: var(--panel); box-shadow: 0 0 0 2px var(--ink); padding: 8px 8px; min-height: 36px; align-items: center; display: flex; justify-content: space-between; gap: 6px; font-size: 15px; cursor: pointer; }
.qrow .qt { color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow .qp { color: var(--gold-hi); font-variant-numeric: tabular-nums; flex: none; }
.qrow.done .qp { color: var(--good); }
.qrow.done { box-shadow: 0 0 0 2px var(--good); }

/* place bar */
#placeBar { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 32; display: flex; justify-content: center; padding: 0 8px; }
#placeBar { pointer-events: none; }
#placeBar .inner { pointer-events: auto; }
#placeBar[hidden] { display: none; }
#placeBar:not([hidden]) ~ #questMini { display: none; }
#placeBar .inner { background: var(--panel); box-shadow: 0 0 0 2px var(--ink); padding: 8px 10px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px; font-size: 16px; max-width: 100%; }
#placeLabel { flex: 1 1 100%; text-align: center; }

/* bottom tabs */
#tabBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--panel-lo); box-shadow: 0 -2px 0 var(--ink); padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); gap: 6px; }
.tabbtn { flex: 1; font-family: var(--f-px); font-size: 8px; padding: 10px 2px; background: var(--panel-2); text-transform: uppercase; box-shadow: 0 0 0 2px var(--ink), inset 2px 2px 0 #432a5c, inset -2px -2px 0 var(--panel-lo); }

/* sheet */
#sheetWrap { position: fixed; left: 0; right: 0; bottom: 0; top: 30%; z-index: 25; pointer-events: none; transform: translateY(100%); transition: transform .22s ease; }
#sheetWrap.open { pointer-events: auto; transform: translateY(0); }
#sheet { position: absolute; inset: 0; background: var(--panel); box-shadow: 0 -2px 0 var(--ink), inset 0 2px 0 #432a5c; display: flex; flex-direction: column; border-radius: 10px 10px 0 0; overflow: hidden; }
#sheetHead { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--panel-lo); flex: none; }
#sheetTitle { font-size: 11px; color: var(--gold-hi); }
#sheetBody { padding: 10px 12px calc(84px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; flex: 1; }
.closex { width: 30px; height: 30px; font-size: 16px; background: var(--panel-2); box-shadow: 0 0 0 2px var(--ink); }

.sub { font-size: 16px; color: var(--muted); margin: 2px 0 10px; }
.sub2 { font-size: 15px; color: var(--muted); margin: 2px 0; }
.h4 { font-size: 9px; color: var(--gold-hi); margin: 14px 0 6px; text-transform: uppercase; }
.note { font-size: 15px; color: var(--muted); padding: 8px 0; }
.note.warn { color: var(--gold-hi); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.rowgap { display: flex; gap: 8px; margin-top: 8px; }
.rowgap .pbtn { flex: 1; }

.chiptabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; }
.chiptab { flex: none; font-family: var(--f-px); font-size: 8px; padding: 8px 10px; background: var(--panel-2); box-shadow: 0 0 0 2px var(--ink); text-transform: uppercase; }
.chiptab[aria-pressed="true"] { background: var(--gold); color: #2b1a05; }

.bcard2 { background: var(--panel-lo); box-shadow: 0 0 0 2px var(--ink); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.bcard2.locked { opacity: .55; }
.bcard2.done2 { opacity: .7; }
.bc-top { display: flex; gap: 10px; align-items: center; }
.bc-info h4 { font-size: 10px; color: var(--gold-hi); margin-bottom: 3px; }
.bc-info p { font-size: 15px; color: var(--muted); margin: 0; }
.costs { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.cost { display: inline-flex; align-items: center; gap: 3px; font-size: 16px; }
.cost.short { color: var(--bad); }

.hscroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; }
.hscroll2 { display: flex; gap: 6px; flex-wrap: wrap; }
.rbtn { flex: none; width: 112px; background: var(--panel-lo); box-shadow: 0 0 0 2px var(--ink); padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rbtn.locked { opacity: .5; }
.rbtn b { font-size: 11px; color: var(--cream); }

.erow { display: flex; align-items: center; gap: 10px; background: var(--panel-lo); box-shadow: 0 0 0 2px var(--ink); padding: 8px; cursor: pointer; }
.erow.sm { padding: 6px; }
.erow.lose { opacity: .75; }
.eport { width: 40px; height: 40px; display: grid; place-items: center; background: var(--panel-2); flex: none; }
.ebody { flex: 1; min-width: 0; }
.ebody h4 { font-size: 10px; color: var(--gold-hi); }
.ebody p { font-size: 14px; color: var(--muted); margin: 2px 0 0; }
.chev { color: var(--muted); font-size: 18px; }
.trait { font-size: 13px; padding: 1px 5px; }
.trait.good { color: var(--good); } .trait.bad { color: var(--bad); }
.rar { font-weight: 700; }

.detail-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.port.big { width: 72px; height: 72px; display: grid; place-items: center; background: var(--panel-2); flex: none; }
.statgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 15px; color: var(--muted); margin-bottom: 6px; }
.statgrid b { color: var(--cream); }
.pbar { display: inline-block; width: 70px; height: 7px; background: var(--ink); vertical-align: middle; margin-right: 6px; }
.pbar i { display: block; height: 100%; }
.skl { margin: 0; padding-left: 16px; font-size: 15px; color: var(--muted); }
.skl li b { color: var(--cream); }
.eqslot { display: flex; justify-content: space-between; align-items: center; background: var(--panel-lo); padding: 7px 9px; margin-bottom: 4px; font-size: 15px; }
.eqslot.empty { color: var(--muted); font-style: italic; }
.item-row { display: flex; justify-content: space-between; align-items: center; background: var(--panel-lo); padding: 7px 9px; margin-bottom: 4px; font-size: 15px; }
.craftrow { display: flex; align-items: center; gap: 8px; background: var(--panel-lo); padding: 7px 9px; margin-bottom: 4px; font-size: 15px; }
.craftrow span:first-child { flex: 1; }

.terrcard { display: flex; gap: 10px; background: var(--panel-lo); box-shadow: 0 0 0 2px var(--ink); padding: 10px; cursor: pointer; }
.terrcard.locked { opacity: .55; }
.terrcard h4 { font-size: 10px; color: var(--gold-hi); }
.tier { font-size: 11px; color: var(--muted); text-transform: none; }
.pickrow { display: flex; align-items: center; gap: 8px; background: var(--panel-lo); padding: 7px 9px; font-size: 15px; }
.pickrow input { width: 18px; height: 18px; }

.activeres { background: var(--panel-lo); box-shadow: 0 0 0 2px var(--ink); padding: 10px; margin-bottom: 10px; font-size: 15px; }

/* modal + toast */
#modal { position: fixed; inset: 0; z-index: 40; background: rgba(6, 4, 14, .72); display: flex; align-items: center; justify-content: center; padding: 20px; }
#modal[hidden] { display: none; }
.modalcard { background: var(--panel); box-shadow: 0 0 0 2px var(--ink), inset 2px 2px 0 #432a5c; padding: 18px; max-width: 380px; width: 100%; max-height: 80vh; overflow-y: auto; }
.modalcard h2 { font-size: 13px; color: var(--gold-hi); margin-bottom: 10px; line-height: 1.5; }
.kicker { font-family: var(--f-px); font-size: 8px; color: var(--accent-hi); text-transform: uppercase; margin-bottom: 8px; }
.modalcard p { font-size: 17px; color: var(--cream); }
.modalcard .pbtn { width: 100%; margin-top: 10px; }

#toast { position: fixed; left: 50%; top: calc(var(--hud-h, 120px) + 10px); transform: translateX(-50%); z-index: 50; background: var(--panel); box-shadow: 0 0 0 2px var(--ink); padding: 8px 14px; font-size: 15px; max-width: 86vw; text-align: center; }
#toast.bad { color: var(--bad); }
#toast[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div class="hudbar">
    <div id="hud-res"></div>
  </div>
  <div class="hudbar" style="margin-top:4px;">
    <div class="hudinfo">
      <span id="hud-castle"></span>
      <span>Pop <b class="pop" id="hud-pop"></b></span>
      <span>Captives <b id="hud-hum"></b></span>
      <span id="hud-hap"></span>
    </div>
    <div class="hudrow">
      <div id="speedRow" class="hudctrl">
        <button class="iconbtn" data-act="speed" data-v="1">1x</button>
        <button class="iconbtn" data-act="speed" data-v="2">2x</button>
        <button class="iconbtn" data-act="speed" data-v="4">4x</button>
        <button class="iconbtn" data-act="speed" data-v="8">8x</button>
      </div>
      <div class="hudctrl">
        <button class="iconbtn" data-act="center" title="Center on castle">&#8962;</button>
        <button class="iconbtn" id="pauseBtn" data-act="pause" title="Pause">II</button>
        <button class="iconbtn" data-act="tab-settings" title="Settings and save">&#9881;</button>
      </div>
    </div>
  </div>
</div>

<div id="placeBar" hidden>
  <div class="inner">
    <span id="placeLabel"></span>
    <button class="pbtn go" id="placeOk" data-act="place-confirm">Place</button>
    <button class="pbtn dark" data-act="place-rotate">Rotate</button>
    <button class="pbtn danger" data-act="place-cancel">Cancel</button>
  </div>
</div>

<div id="questMini"></div>

<div id="sheetWrap">
  <div id="sheet">
    <div id="sheetHead"><h3 id="sheetTitle"></h3><button class="closex" data-act="sheet-close">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="tabBar"></div>

<div id="toast" hidden></div>
<div id="modal" hidden></div>

<script>
/* MONSTERHAVEN config: every balance number lives here. Rates are per minute unless noted. */
(function () {
  "use strict";
  var MH = window.MH = window.MH || {};
  var C = MH.C = {};

  C.TILE = 16; C.W = 64; C.H = 48;
  C.SAVE_KEY = "monsterhaven-save-v1";
  C.AUTOSAVE = 15;                 // seconds
  C.OFFLINE_CAP = 8 * 3600;        // max seconds credited while away
  C.OFFLINE_UPTIME = 0.7;          // share of time workers are actually working
  C.DAY_LEN = 480;                 // seconds per day/night cycle
  C.START = { gold: 220, food: 140, wood: 120, stone: 70, iron: 12, essence: 0 };
  C.RES = ["gold", "food", "wood", "stone", "iron", "essence"];
  C.RES_NAME = { gold: "Gold", food: "Food", wood: "Wood", stone: "Stone", iron: "Iron", essence: "Essence" };
  C.RES_COLOR = { gold: "#f2c14e", food: "#e0553f", wood: "#d9a766", stone: "#aab2bf", iron: "#9db4d0", essence: "#c58cf0" };
  C.BASE_CAP = 300;                // per resource, before storages
  C.PRICE = { food: 0.8, wood: 1, stone: 1.4, iron: 4, essence: 12 }; // gold value for trading
  C.TRADE_LOT = 10;
  C.HUMAN_EAT = 0.6;
  C.SPEEDS = [1, 2, 4, 8];

  C.RARITY = [
    { id: "common", name: "Common", mult: 1, color: "#b8b2a0", w: 70 },
    { id: "uncommon", name: "Uncommon", mult: 1.15, color: "#7fcf5a", w: 20 },
    { id: "rare", name: "Rare", mult: 1.35, color: "#5aa0d0", w: 7 },
    { id: "epic", name: "Epic", mult: 1.65, color: "#b06ad9", w: 2.5 },
    { id: "legendary", name: "Legendary", mult: 2.1, color: "#f2b53c", w: 0.5 }
  ];

  C.TRAITS = {
    lazy: { name: "Lazy", desc: "Works 20% slower.", good: false },
    hardworking: { name: "Hardworking", desc: "Works 20% faster.", good: true },
    greedy: { name: "Greedy", desc: "Costs 25% more to recruit, 0.3 gold/min upkeep.", good: false },
    loyal: { name: "Loyal", desc: "Never deserts, small happiness boost.", good: true },
    brave: { name: "Brave", desc: "+10% attack on raids.", good: true },
    intelligent: { name: "Intelligent", desc: "+30% research speed, +20% XP.", good: true },
    aggressive: { name: "Aggressive", desc: "+15% damage on raids.", good: true }
  };

  /* monster species. jobs: efficiency per building type (missing = 0.5) */
  C.SPECIES = {
    goblin: { name: "Goblin", role: "Worker", hp: 30, atk: 6, def: 2, work: 1.0, eat: 0.5, speed: 1.05, unlock: 1, cost: { gold: 40 },
      jobs: { farm: 0.8, lumber: 0.8, workshop: 0.95, mine: 0.7, alchemist: 0.6, trading: 0.95, blacksmith: 0.8, temple: 0.7, tower: 0.6 },
      cskill: "Sneak Attack", cdesc: "20% chance to strike for 1.8x damage.", wskill: "Nimble Fingers", wdesc: "+12% work speed (Lv5)." },
    kobold: { name: "Kobold", role: "Miner", hp: 26, atk: 5, def: 3, work: 1.0, eat: 0.4, speed: 1.0, unlock: 1, cost: { gold: 55 },
      jobs: { mine: 1.35, farm: 0.6, lumber: 0.7, workshop: 0.8, blacksmith: 0.9, alchemist: 0.6, trading: 0.7, temple: 0.6, tower: 0.6 },
      cskill: "Burrow Strike", cdesc: "+30% damage in the first two rounds.", wskill: "Deep Delver", wdesc: "+12% work speed (Lv5)." },
    slime: { name: "Slime", role: "Alchemist", hp: 40, atk: 4, def: 1, work: 1.0, eat: 0.4, speed: 0.8, unlock: 2, cost: { gold: 80 },
      jobs: { alchemist: 1.35, workshop: 1.1, farm: 0.8, temple: 0.9, tower: 0.8, trading: 0.7, blacksmith: 0.5, mine: 0.4, lumber: 0.4 },
      cskill: "Ooze Mend", cdesc: "Heals the weakest ally for 8% max HP each round.", wskill: "Catalyst", wdesc: "+12% work speed (Lv5)." },
    orc: { name: "Orc", role: "Soldier", hp: 60, atk: 11, def: 5, work: 1.0, eat: 0.8, speed: 1.0, unlock: 2, cost: { gold: 110 },
      jobs: { lumber: 1.25, mine: 1.1, blacksmith: 1.2, farm: 0.6, workshop: 0.7, temple: 0.5, tower: 0.4, alchemist: 0.4, trading: 0.5 },
      cskill: "Cleave", cdesc: "Hits a second foe for half damage.", wskill: "Heavy Hauler", wdesc: "+12% work speed (Lv5)." },
    skeleton: { name: "Skeleton", role: "Mage-hand", hp: 38, atk: 9, def: 3, work: 1.0, eat: 0.2, speed: 1.0, unlock: 3, cost: { gold: 150, essence: 5 },
      jobs: { tower: 1.4, temple: 1.2, alchemist: 1.0, blacksmith: 0.8, workshop: 0.7, trading: 0.5, mine: 0.6, lumber: 0.5, farm: 0.3 },
      cskill: "Bone Ward", cdesc: "+25% defense in battle.", wskill: "Arcane Study", wdesc: "+12% work speed (Lv5)." },
    vampire: { name: "Vampire", role: "Elite", hp: 85, atk: 16, def: 7, work: 1.0, eat: 0.6, speed: 1.15, unlock: 4, cost: { gold: 420, essence: 40 },
      jobs: { temple: 1.4, tower: 1.1, trading: 1.2, alchemist: 0.9, blacksmith: 0.8, workshop: 0.6, mine: 0.5, lumber: 0.5, farm: 0.3 },
      cskill: "Blood Drain", cdesc: "Heals for 25% of damage dealt. Leads the squad: +10% ATK.", wskill: "Dark Charisma", wdesc: "+12% work speed (Lv5)." }
  };
  C.EVOLVE = { goblin: "Hobgoblin", kobold: "Dragonkin", slime: "Ooze King", orc: "Warlord", skeleton: "Lich", vampire: "Elder Vampire" };
  C.EVOLVE_COST = { gold: 300, essence: 25 };
  C.EVOLVE_LEVEL = 10;
  C.EVOLVE_MULT = 1.5;
  C.MAX_LEVEL = 20;
  C.RECRUIT_GREEDY = 1.25;

  C.MNAMES = {
    goblin: ["Grix", "Snaggle", "Mog", "Nib", "Skrit", "Zook", "Pik", "Rizzle", "Wort", "Gnash"],
    kobold: ["Dink", "Tuk", "Zerp", "Bolt", "Kiv", "Rusk", "Yip", "Scree", "Nok", "Dree"],

  };

  UI.toast = function (msg, bad) { toast = { msg: msg, bad: bad }; toastT = 2.4; renderToast(); };
  function renderToast() {
    var t = $("toast"); if (!t) return;
    if (!toast) { t.hidden = true; return; }
    t.hidden = false; t.textContent = toast.msg; t.className = "toast" + (toast.bad ? " bad" : "");
  }
  UI.tickToast = function (dt) { if (toastT > 0) { toastT -= dt; if (toastT <= 0) { toast = null; renderToast(); } } };

  /* ---------- quest tracker (floating) ---------- */
  UI.quests = function () {
    var box = $("questMini"); var list = S.activeQuests();
    setHtml(box, list.map(function (q) {
      var p = S.qProgress(q), done = p >= q.goal;
      return '<div class="qrow' + (done ? " done" : "") + '" data-act="' + (done ? "claim" : "quest-open") + '" data-q="' + q.id + '"><span class="qt">' + esc(q.title) + '</span><span class="qp">' + (done ? "Claim!" : p + "/" + q.goal) + "</span></div>";
    }).join("") || '<div class="qrow done">All current quests complete!</div>');
  };

  /* ---------- sheet plumbing ---------- */
  function openSheet(mode, data) { sheetMode = mode; sheet = data || {}; renderSheet(); $("sheetWrap").classList.add("open"); }
  function closeSheet() { $("sheetWrap").classList.remove("open"); sheetMode = null; Rd.setSelection(null); Rd.setPlaceMode(null); UI.placeBar(null); }
  UI.closeSheet = closeSheet;
  UI.isOpen = function () { return !!sheetMode; };
  UI.refreshSheet = function () { if (sheetMode) renderSheet(); };
  var pressing = false;
  ["#sheetWrap", "#questMini"].forEach(function (sel) {
    var n = document.querySelector(sel); if (!n) return;
    n.addEventListener("pointerdown", function () { pressing = true; });
  });
  ["pointerup", "pointercancel"].forEach(function (ev) { window.addEventListener(ev, function () { setTimeout(function () { pressing = false; }, 0); }); });
  /* the 2-per-second background refresh: never repaint under a finger that is mid-tap */
  UI.pollSheet = function () { if (sheetMode && !pressing) renderSheet(); };

  function renderSheet() {
    var body = $("sheetBody"), title = $("sheetTitle");
    var fn = SHEETS[sheetMode]; if (!fn) { closeSheet(); return; }
    var r = fn(sheet);
    title.textContent = r.title;
    setHtml(body, r.html);
  }

  /* ---------- cost / rarity helpers ---------- */
  function costRow(cost) {
    return '<div class="costs">' + Object.keys(cost).map(function (k) {
      var short = S.G.res[k] < cost[k];
      return '<span class="cost' + (short ? " short" : "") + '">' + Art.img("i_" + k, 1) + Math.ceil(cost[k] * 10) / 10 + "</span>";
    }).join("") + "</div>";
  }
  function rarTag(rar) { var r = C.RARITY[rar]; return '<span class="rar" style="color:' + r.color + '">' + r.name + "</span>"; }
  function barPx(v, max, color) { return '<span class="pbar"><i style="width:' + Math.max(0, Math.min(100, (v / max) * 100)) + "%;background:" + color + '"></i></span>'; }

  /* ================= BUILD ================= */
  function buildTab(cat) {
    cat = cat || "town";
    var cats = C.BUILD_CATS.map(function (c) { return '<button class="chiptab" data-act="build-cat" data-cat="' + c[0] + '" aria-pressed="' + (c[0] === cat) + '">' + c[1] + "</button>"; }).join("");
    var rows = Object.keys(C.BUILD).filter(function (k) { return C.BUILD[k].cat === cat && !C.BUILD[k].fixed; }).map(function (k) {
      var def = C.BUILD[k], locked = def.unlock > S.G.castle, atMax = (S.D.cnt[k] || 0) >= def.max;
      var cost = S.buildCost(k), dis = locked || atMax;
      return '<div class="bcard2' + (dis ? " locked" : "") + '"><div class="bc-top"><img class="px" src="' + Art.thumb(k, 1, 56) + '" width="56" height="56"><div class="bc-info"><h4>' + def.name + '</h4><p>' + def.desc + "</p></div></div>" +
        (locked ? '<p class="note warn">Needs castle level ' + def.unlock + "</p>" : atMax ? '<p class="note warn">Limit reached (' + def.max + ")</p>" : costRow(cost)) +
        '<button class="pbtn ' + (dis || !S.canAfford(cost) ? "" : "go") + '" type="button" data-act="build-pick" data-type="' + k + '"' + (dis ? " disabled" : "") + ">Place</button></div>";
    }).join("");
    return '<div class="chiptabs">' + cats + '</div><div class="stack">' + rows + "</div>";
  }

  /* ================= MONSTERS ================= */
  function traitLine(m) { var t = C.TRAITS[m.trait]; return '<span class="trait' + (t.good ? " good" : " bad") + '">' + t.name + "</span>"; }
  function monsterRow(m) {
    var sp = C.SPECIES[m.sp], jb = m.job ? S.bld(m.job) : null;
    return '<div class="erow" data-act="open-ent" data-id="' + m.id + '"><div class="eport">' + Art.img(m.sp, 2) + "</div><div class=\"ebody\"><h4>" + esc(m.name) + " <small>Lv" + m.level + "</small></h4>" +
      '<p>' + sp.name + (m.evolved ? " → " + C.EVOLVE[m.sp] : "") + " &middot; " + rarTag(m.rar) + " &middot; " + traitLine(m) + "</p>" +
      '<p class="sub2">' + (m.away ? "On a raid" : jb ? "Working: " + C.BUILD[jb.type].name : "Idle") + (m.hpf < 0.99 ? " &middot; HP " + pct(m.hpf) + "%" : "") + "</p></div><span class=\"chev\">›</span></div>";
  }
  function monstersTab(filter) {
    filter = filter || "all";
    var G = S.G, list = G.monsters.slice().sort(function (a, b) { return b.rar - a.rar || b.level - a.level; });
    if (filter !== "all") list = list.filter(function (m) { return m.sp === filter; });
    var tabs = ['<button class="chiptab" data-act="mon-filter" data-f="all" aria-pressed="' + (filter === "all") + '">All (' + G.monsters.length + ")</button>"]
      .concat(Object.keys(C.SPECIES).map(function (k) { var c = G.monsters.filter(function (m) { return m.sp === k; }).length; return '<button class="chiptab" data-act="mon-filter" data-f="' + k + '" aria-pressed="' + (filter === k) + '">' + C.SPECIES[k].name + " (" + c + ")</button>"; }));
    var recruit = Object.keys(C.SPECIES).map(function (k) {
      var sp = C.SPECIES[k], locked = sp.unlock > G.castle, cost = S.recruitCost(k);
      return '<button class="rbtn' + (locked ? " locked" : "") + '" type="button" data-act="recruit" data-sp="' + k + '"' + (locked ? " disabled" : "") + '>' + Art.img(k, 2) + "<b>" + sp.name + "</b>" + (locked ? "Lv" + sp.unlock : costRow(cost)) + "</button>";
    }).join("");
    return '<p class="sub">' + G.monsters.length + "/" + S.D.housing + ' housed</p><div class="hscroll">' + recruit + '</div><div class="chiptabs">' + tabs.join("") + '</div><div class="stack">' + (list.map(monsterRow).join("") || '<p class="note">No monsters match.</p>') + "</div>";
  }

  /* ================= HUMANS ================= */
  function humanRow(h) {
    var def = C.HUMAN[h.occ], jb = h.job ? S.bld(h.job) : null, escaping = h.st === "escape";
    return '<div class="erow" data-act="open-ent" data-id="' + h.id + '"><div class="eport">' + Art.img("h_" + h.occ, 2) + "</div><div class=\"ebody\"><h4>" + esc(h.name) + "</h4><p>" + def.name + " &middot; " + rarTag(h.rar) + "</p>" +
      '<p class="sub2">' + (escaping ? '<span class="warnText">Fleeing!</span>' : jb ? "Working: " + C.BUILD[jb.type].name : "Idle") + "</p></div><span class=\"chev\">›</span></div>";
  }
  function humansTab() {
    var G = S.G, list = G.humans.slice().sort(function (a, b) { return b.rar - a.rar; });
    return '<p class="sub">' + list.filter(function (h) { return h.st !== "escape"; }).length + "/" + S.D.prisonCap + ' held &middot; eating ' + n1(S.D.eatH) + " food/min</p><div class=\"stack\">" + (list.map(humanRow).join("") || '<p class="note">No captives yet. Send a raid in Military.</p>') + "</div>";
  }

  /* ================= ENTITY DETAIL ================= */
  function itemRow(it, mid) {
    return '<div class="item-row"><span>' + it.name + " <b>+" + it.val + "</b> " + rarTag(it.rar) + '</span><button class="pbtn sm" data-act="equip" data-m="' + mid + '" data-i="' + it.id + '">Equip</button></div>';
  }
  function eqSlot(m, slot) {
    var it = m.eq[slot];
    if (!it) return '<div class="eqslot empty">No ' + slot + "</div>";
    return '<div class="eqslot"><span>' + it.name + " <b>+" + it.val + "</b></span><button class=\"pbtn sm dark\" data-act=\"unequip\" data-m=\"" + m.id + '" data-slot="' + slot + '">Remove</button></div>';
  }
  function entSheet(d) {
    var e = S.ent(d.id);
    if (!e) return { title: "Gone", html: "<p class=\"note\">This one is no longer around.</p>" };
    if (e.kind === "m") {
      var sp = C.SPECIES[e.sp], need = S.xpNeed(e.level);
      var items = S.G.items.filter(function (i) { return i.slot === "weapon"; }), armors = S.G.items.filter(function (i) { return i.slot === "armor"; });
      var skills = S.skills(e).map(function (s) { return "<li><b>" + s.name + "</b> " + s.desc + "</li>"; }).join("") || "<li>Unlocks skills at level 3 and 5.</li>";
      var canEvolve = S.G.research.done.evolution && e.level >= C.EVOLVE_LEVEL && !e.evolved;
      var jobBtns = Object.keys(C.BUILD).filter(function (k) { var def = C.BUILD[k]; return def.slots && (def.kind !== "human") && (S.D.cnt[k] || 0) > 0; }).map(function (k) {
        return S.G.buildings.filter(function (b) { return b.type === k; }).map(function (b) {
          var full = b.workers.length >= S.slots(b), here = e.job === b.id;
          return '<button class="pbtn sm ' + (here ? "go" : "") + '" data-act="assign" data-m="' + e.id + '" data-b="' + b.id + '"' + (full && !here ? " disabled" : "") + ">" + C.BUILD[k].name + (b.workers.length) + "/" + S.slots(b) + "</button>";
        }).join("");
      }).join("");
      return { title: e.name, html:
        '<div class="detail-head"><div class="port big">' + Art.img(e.sp, 4) + '</div><div><h3>' + esc(e.name) + " &middot; Lv" + e.level + "</h3><p>" + sp.name + (e.evolved ? " → " + C.EVOLVE[e.sp] : "") + " &middot; " + rarTag(e.rar) + " &middot; " + traitLine(e) + "</p>" +
        '<p class="sub2">XP ' + barPx(e.xp, need, "#f2b53c") + Math.floor(e.xp) + "/" + need + "</p></div></div>" +
        '<div class="statgrid"><span>HP <b>' + Math.round(S.stat(e, "hp") * e.hpf) + "/" + Math.round(S.stat(e, "hp")) + "</b></span><span>ATK <b>" + n1(S.stat(e, "atk")) + "</b></span><span>DEF <b>" + n1(S.stat(e, "def")) + '</b></span><span>Power <b>' + Math.round(S.power(e)) + "</b></span></div>" +
        '<h4 class="h4">Skills</h4><ul class="skl">' + skills + "</ul>" +
        '<h4 class="h4">Equipment</h4>' + eqSlot(e, "weapon") + eqSlot(e, "armor") +
        (items.length ? '<p class="sub2">Available weapons</p>' + items.map(function (i) { return itemRow(i, e.id); }).join("") : "") +
        (armors.length ? '<p class="sub2">Available armor</p>' + armors.map(function (i) { return itemRow(i, e.id); }).join("") : "") +
        '<h4 class="h4">Assign to work</h4><div class="hscroll2">' + (jobBtns || '<p class="note">Build a workplace first.</p>') + "</div>" +
        (e.job ? '<button class="pbtn dark" data-act="unassign" data-m="' + e.id + '">Unassign</button>' : "") +
        (canEvolve ? '<button class="pbtn go" data-act="evolve" data-m="' + e.id + '">Evolve into ' + C.EVOLVE[e.sp] + " (" + costRow(C.EVOLVE_COST) + ")</button>" : "") +
        (e.away ? "" : '<button class="pbtn danger" data-act="dismiss" data-m="' + e.id + '">Dismiss</button>') };
    }
    var def = C.HUMAN[e.occ];
    var hjobs = Object.keys(C.BUILD).filter(function (k) { return C.BUILD[k].slots && C.BUILD[k].kind !== "monster"; }).reduce(function (a, k) { return a.concat(S.G.buildings.filter(function (b) { return b.type === k; })); }, []).map(function (b) {
      var full = b.workers.length >= S.slots(b), here = e.job === b.id;
      return '<button class="pbtn sm ' + (here ? "go" : "") + '" data-act="assign" data-m="' + e.id + '" data-b="' + b.id + '"' + (full && !here ? " disabled" : "") + ">" + C.BUILD[b.type].name + " " + b.workers.length + "/" + S.slots(b) + "</button>";
    }).join("");
    return { title: e.name, html:
      '<div class="detail-head"><div class="port big">' + Art.img("h_" + e.occ, 4) + '</div><div><h3>' + esc(e.name) + "</h3><p>" + def.name + " &middot; " + rarTag(e.rar) + '</p><p class="sub2">Productivity ' + n1(e.prod) + "x &middot; HP " + e.hp + "</p></div></div>" +
      (e.st === "escape" ? '<p class="note warn">Fleeing toward the gate!</p>' : "") +
      '<h4 class="h4">Assign to work</h4><div class="hscroll2">' + (hjobs || '<p class="note">Build a human facility first.</p>') + "</div>" +
      (e.job ? '<button class="pbtn dark" data-act="unassign" data-m="' + e.id + '">Unassign</button>' : "") };
  }

  /* ================= BUILDING DETAIL ================= */
  function bldSheet(d) {
    var b = S.bld(d.id); if (!b) return { title: "Gone", html: "<p class=\"note\">That building is gone.</p>" };
    var def = C.BUILD[b.type], cap = S.levelCap(b), upCost = b.level < cap ? S.upCost(b) : null;
    var rate = def.out ? S.bRate(b, 1) : null;
    var html = '<div class="detail-head"><img class="px" src="' + Art.thumb(b.type, b.level, 72) + '" width="72" height="72"><div><h3>' + def.name + " Lv" + b.level + "</h3><p>" + def.desc + "</p></div></div>";
    if (rate) html += '<div class="statgrid">' + Object.keys(rate).map(function (k) { return "<span>" + C.RES_NAME[k] + " <b>+" + n1(rate[k]) + "/m</b></span>"; }).join("") + "</div>";
    if (def.slots) {
      var slots = S.slots(b), workers = b.workers.map(S.ent).filter(Boolean);
      html += '<h4 class="h4">Workers (' + workers.length + "/" + slots + ')</h4><div class="stack">' + (workers.map(function (e) { return '<div class="erow sm" data-act="open-ent" data-id="' + e.id + '">' + Art.img(e.kind === "m" ? e.sp : "h_" + e.occ, 2) + "<span>" + esc(e.name) + '</span><button class="pbtn sm dark" data-act="unassign" data-m="' + e.id + '">Remove</button></div>'; }).join("") || '<p class="note">Assign monsters or humans from their own panel.</p>') + "</div>";
    }
    if (b.type === "castle") {
      var cu = C.CASTLE_UP[b.level];
      if (cu) html += '<h4 class="h4">Next level unlocks</h4><p class="note">' + cu.unlocks + "</p><p class=\"sub2\">Needs " + cu.pop + " monsters" + (cu.need.length ? " and a " + cu.need.map(function (n) { return C.BUILD[n].name; }).join(", ") : "") + "</p>";
    }
    if (b.type === "blacksmith") {
      html += '<h4 class="h4">Craft equipment</h4><p class="sub2">Tier unlocked: ' + S.maxTier("weapon") + "</p>";
      for (var t = 1; t <= 5; t++) {
        var locked = t > S.maxTier("weapon"), cost = C.CRAFT_COST(t);
        html += '<div class="craftrow"><span>Tier ' + t + "</span>" + costRow(cost) + '<button class="pbtn sm" data-act="craft" data-slot="weapon" data-t="' + t + '"' + (locked ? " disabled" : "") + '>Weapon</button><button class="pbtn sm" data-act="craft" data-slot="armor" data-t="' + t + '"' + (locked ? " disabled" : "") + ">Armor</button></div>";
      }
    }
    if (b.type === "trading") {
      html += '<h4 class="h4">Trade (lot of ' + C.TRADE_LOT + ')</h4>' + C.RES.filter(function (r) { return r !== "gold"; }).map(function (r) {
        var p = Math.round(S.price(r) * C.TRADE_LOT);
        return '<div class="craftrow"><span>' + Art.img("i_" + r, 1) + C.RES_NAME[r] + " ~" + p + "g</span><button class=\"pbtn sm\" data-act=\"trade\" data-res=\"" + r + '" data-side="buy">Buy</button><button class="pbtn sm dark" data-act="trade" data-res="' + r + '" data-side="sell">Sell</button></div>';
      }).join("");
    }
    if (upCost) html += '<h4 class="h4">Upgrade to Lv' + (b.level + 1) + "</h4>" + costRow(upCost) + '<button class="pbtn go" data-act="upgrade" data-b="' + b.id + '">Upgrade</button>';
    else html += '<p class="note">Max level' + (b.type !== "castle" ? " for this castle tier" : "") + ".</p>";
    if (!def.fixed) {
      html += '<div class="rowgap"><button class="pbtn dark" data-act="move-bld" data-b="' + b.id + '">Move</button><button class="pbtn danger" data-act="remove-bld" data-b="' + b.id + '">Remove</button></div>';
    }
    return { title: def.name, html: html };
  }

  /* ================= MILITARY / RAID ================= */
  function raidSheet(d) {
    if (d.terr) return raidDetail(d.terr);
    var html = C.TERR.map(function (t) {
      var unlocked = Raid.unlocked(t);
      return '<div class="terrcard' + (unlocked ? "" : " locked") + '" data-act="raid-open" data-t="' + t.id + '"><img class="px" src="' + Art.thumb("prison", 1, 44) + '" width="44" height="44"><div class="bc-info"><h4>' + t.name + ' <span class="tier">Tier ' + t.tier + "</span></h4><p>" + t.desc + "</p>" +
        (unlocked ? '<p class="sub2">Strength ~' + t.str + " &middot; travel " + t.travel + "s</p>" : '<p class="note warn">Needs castle level ' + t.castle + (t.gate ? " and a " + C.BUILD[t.gate].name : "") + "</p>") + "</div></div>";
    }).join("");
    var active = S.G.exps.length ? '<h4 class="h4">Squads out</h4>' + S.G.exps.map(function (e) {
      var t = Raid.terrFor(e.terr);
      return '<div class="craftrow"><span>' + t.name + "</span><span>" + Math.ceil(e.left) + "s left</span><button class=\"pbtn sm dark\" data-act=\"recall\" data-e=\"" + e.id + '">Recall</button></div>';
    }).join("") : "";
    var reports = S.G.reports.length ? '<h4 class="h4">Recent reports</h4><div class="stack">' + S.G.reports.slice(0, 6).map(function (r) {
      return '<div class="erow sm ' + (r.win ? "" : "lose") + '" data-act="report-open" data-r="' + r.id + '"><span>' + (r.win ? "✔" : "✖") + " " + r.terr + "</span><span class=\"chev\">›</span></div>";
    }).join("") + "</div>" : "";
    return { title: "Military", html: '<p class="sub">Squad limit: ' + S.D.squadCap + "</p>" + active + '<h4 class="h4">Territories</h4><div class="stack">' + html + "</div>" + reports };
  }
  function raidDetail(id) {
    var t = Raid.terrFor(id), unlocked = Raid.unlocked(t);
    if (!unlocked) return { title: t.name, html: '<p class="note warn">Needs castle level ' + t.castle + (t.gate ? " and a " + C.BUILD[t.gate].name : "") + '.</p><button class="pbtn dark" data-act="raid-back">Back</button>' };
    var picks = raidPick[id] || (raidPick[id] = []);
    var avail = S.G.monsters.filter(function (m) { return !m.away; }).sort(function (a, b) { return S.power(b) - S.power(a); });
    var power = Raid.squadPower(picks), chance = Raid.winChance(power, t), pc = Math.round(chance * 100);
    var odds = picks.length ? '<p class="odds ' + (pc >= 70 ? "hi" : pc >= 40 ? "mid" : "lo") + '">Win chance ~' + pc + "%" + (pc < 40 ? " — risky!" : "") + "</p>" : "";
    var rows = avail.map(function (m) {
      var on = picks.indexOf(m.id) >= 0;
      return '<label class="pickrow"><input type="checkbox" data-act="raid-pick" data-m="' + m.id + '"' + (on ? " checked" : "") + (!on && picks.length >= S.D.squadCap ? " disabled" : "") + '>' + Art.img(m.sp, 2) + '<span>' + esc(m.name) + " Lv" + m.level + " (" + Math.round(S.power(m)) + " pwr)</span></label>";
    }).join("") || '<p class="note">No monsters available.</p>';
    return { title: t.name, html: '<p>' + t.desc + '</p><p class="sub2">Enemy strength ~' + t.str + " &middot; travel " + t.travel + "s &middot; up to " + S.D.squadCap + " monsters</p>" +
      '<h4 class="h4">Rewards</h4><div class="costs">' + Object.keys(t.rew).map(function (k) { return '<span class="cost">' + Art.img("i_" + k, 1) + t.rew[k][0] + "-" + t.rew[k][1] + "</span>"; }).join("") + "</div>" +
      '<h4 class="h4">Pick your squad (' + picks.length + "/" + S.D.squadCap + ')</h4><div class="stack">' + rows + '</div>' +
      '<p class="sub2">Squad power: ' + Math.round(power) + " vs strength " + t.str + "</p>" + odds +
      '<button class="pbtn dark" data-act="raid-auto" data-t="' + id + '">Auto-pick strongest</button>' +
      '<button class="pbtn go" data-act="raid-send" data-t="' + id + '"' + (picks.length ? "" : " disabled") + '>Send squad</button><button class="pbtn dark" data-act="raid-back">Back</button>' };
  }
  function reportSheet(d) {
    var r = S.G.reports.filter(function (x) { return x.id === d.r; })[0];
    if (!r) return { title: "Report", html: "<p class=\"note\">Report not found.</p>" };
    var rew = Object.keys(r.rewards).filter(function (k) { return k !== "_item"; }).map(function (k) { return '<span class="cost">' + Art.img("i_" + k, 1) + "+" + r.rewards[k] + "</span>"; }).join("");
    return { title: (r.win ? "Victory: " : "Defeat: ") + r.terr, html:
      '<div class="statgrid">' + r.squad.map(function (s) { return "<span>" + esc(s.name) + " <b>" + s.hp + "% HP</b></span>"; }).join("") + "</div>" +
      (r.win ? '<h4 class="h4">Loot</h4><div class="costs">' + rew + "</div>" + (r.rewards._item ? "<p class=\"sub2\">Found: " + r.rewards._item + "</p>" : "") : '<p class="note warn">The squad was beaten back.</p>') +
      (r.captives.length ? '<h4 class="h4">Captured</h4><ul class="skl">' + r.captives.map(function (c) { return "<li>" + esc(c.name) + " — " + c.occ + " (" + C.RARITY[c.rar].name + ")</li>"; }).join("") + "</ul>" : "") +
      (r.casualties.length ? '<p class="note warn">Lost: ' + r.casualties.join(", ") + "</p>" : "") };
  }

  /* ================= RESEARCH ================= */
  function researchTab() {
    var branches = {};
    C.RESEARCH.forEach(function (r) { (branches[r.branch] = branches[r.branch] || []).push(r); });
    var active = S.G.research.active;
    var activeHtml = active ? (function () { var r = C.RESEARCH.filter(function (x) { return x.id === active.id; })[0]; return '<div class="activeres"><b>' + r.name + "</b>" + barPx(active.total - active.left, active.total, "#f2b53c") + Math.ceil(active.left) + "s left</div>"; })() : "";
    var html = Object.keys(branches).map(function (br) {
      return '<h4 class="h4">' + br + '</h4><div class="stack">' + branches[br].map(function (r) {
        var why = S.canResearch(r), done = why === "done";
        return '<div class="bcard2' + (done ? " done2" : "") + '"><div class="bc-info"><h4>' + r.name + (done ? " ✓" : "") + '</h4><p>' + r.desc + "</p></div>" +
          (done ? "" : why && why !== "Busy" ? '<p class="note warn">' + why + "</p>" : costRow(r.cost) + '<p class="sub2">' + r.time + "s</p>") +
          (done || why === "Busy" || (why && why !== "Busy") ? "" : '<button class="pbtn go" data-act="research" data-id="' + r.id + '"' + (!S.canAfford(r.cost) ? " disabled" : "") + ">Research</button>") + "</div>";
      }).join("") + "</div>";
    }).join("");
    return { title: "Research", html: activeHtml + html };
  }

  /* ================= QUESTS FULL ================= */
  function questsTab() {
    var rows = C.QUESTS.map(function (q) {
      var done = S.G.quests[q.id], p = S.qProgress(q), ready = !done && p >= q.goal;
      return '<div class="bcard2' + (done ? " done2" : "") + '"><div class="bc-info"><h4>' + q.title + (done ? " ✓" : "") + '</h4><p>' + q.desc + "</p><p class=\"sub2\">" + p + "/" + q.goal + "</p></div>" +
        (done ? "" : costRow(q.reward)) + (ready ? '<button class="pbtn go" data-act="claim" data-q="' + q.id + '">Claim</button>' : "") + "</div>";
    }).join("");
    return { title: "Quests", html: '<div class="stack">' + rows + "</div>" };
  }

  /* ================= SETTINGS ================= */
  function settingsTab() {
    return { title: "Settings", html:
      '<p class="sub">The game saves by itself every 15 seconds, and whenever you leave the page.</p>' +
      '<div class="stack"><button class="pbtn go" data-act="save-now">Save now</button>' +
      '<button class="pbtn dark" data-act="export-save">Copy save to clipboard</button>' +
      '<button class="pbtn dark" data-act="import-save">Load save from clipboard</button>' +
      '<button class="pbtn danger" data-act="wipe">Start a new game</button></div>' };
  }

  /* ---------- registry ---------- */
  var SHEETS = {
    build: function (d) { return { title: "Build", html: buildTab(d.cat) }; },
    monsters: function (d) { return { title: "Monsters", html: monstersTab(d.filter) }; },
    humans: function () { return { title: "Humans", html: humansTab() }; },
    military: function (d) { curTerrId = d.terr || null; return raidSheet(d); },
    report: reportSheet, research: researchTab, quests: questsTab, settings: settingsTab,
    ent: entSheet, bld: bldSheet
  };

  UI.openTab = function (tab, data) { openSheet(tab, data || {}); };
  UI.openEnt = function (id) { openSheet("ent", { id: id }); Rd.setSelection({ type: "ent", id: id }); };
  UI.openBld = function (id) { openSheet("bld", { id: id }); Rd.setSelection({ type: "bld", id: id }); };
  UI.openCamp = function (id) { openSheet("military", { terr: id }); };
  UI.openReport = function (id) { openSheet("report", { r: id }); };

  UI.togglePick = function (mid) {
    if (!curTerrId) return;
    mid = parseInt(mid, 10);
    var arr = raidPick[curTerrId] = raidPick[curTerrId] || [];
    var i = arr.indexOf(mid);
    if (i >= 0) arr.splice(i, 1); else if (arr.length < S.D.squadCap) arr.push(mid);
    renderSheet();
  };
  UI.autoPick = function (terrId) {
    var cap = S.D.squadCap, avail = S.G.monsters.filter(function (m) { return !m.away; }).sort(function (a, b) { return S.power(b) - S.power(a); });
    raidPick[terrId] = avail.slice(0, cap).map(function (m) { return m.id; });
    renderSheet();
  };
  UI.sendRaid = function (terrId) {
    var picks = (raidPick[terrId] || []).slice();
    var r = Raid.send(picks, terrId);
    if (r.ok) raidPick[terrId] = [];
    return r;
  };

  /* ---------- modal (tutorial / offline / confirm) ---------- */
  UI.modal = function (html) { var m = $("modal"); m.innerHTML = html; m.hidden = false; };
  UI.closeModal = function () { $("modal").hidden = true; };

  UI.tutorialModal = function (step, total, title, text) {
    UI.modal('<div class="modalcard"><div class="kicker">Tutorial ' + (step + 1) + "/" + total + '</div><h2>' + esc(title) + "</h2><p>" + esc(text) + '</p><button class="pbtn go" data-act="tut-next">' + (step + 1 < total ? "Next" : "Start playing") + "</button></div>");
  };

  UI.offlineModal = function (rep) {
    var hrs = Math.floor(rep.seconds / 3600), mins = Math.round((rep.seconds % 3600) / 60);
    var gained = C.RES.filter(function (k) { return (rep.gross[k] || 0) > 0.5; }).map(function (k) { return '<span class="cost">' + Art.img("i_" + k, 1) + "+" + Math.floor(rep.gross[k]) + "</span>"; }).join("");
    var ev = rep.events.length ? "<ul class=\"skl\">" + rep.events.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + (rep.moreEvents ? "<li>+" + rep.moreEvents + " more</li>" : "") + "</ul>" : '<p class="note">A quiet stretch.</p>';
    UI.modal('<div class="modalcard"><div class="kicker">While you were away</div><h2>' + hrs + "h " + mins + "m passed</h2><div class=\"costs\">" + (gained || '<span class="note">Nothing produced.</span>') + "</div>" +
      (rep.monsters ? '<p class="sub2">+' + rep.monsters + " monster(s) born</p>" : "") + (rep.escapes ? '<p class="note warn">' + rep.escapes + " captive(s) escaped</p>" : "") +
      '<h4 class="h4">What happened</h4>' + ev + '<button class="pbtn go" data-act="close-modal">Continue</button></div>');
  };

  UI.confirm = function (text, actHtml) {
    UI.modal('<div class="modalcard"><h2>Are you sure?</h2><p>' + esc(text) + '</p><div class="rowgap">' + actHtml + '<button class="pbtn dark" data-act="close-modal">Cancel</button></div></div>');
  };

  UI.placeBar = function (p) {
    var bar = $("placeBar");
    if (!p) { if (!bar.hidden) bar.hidden = true; return; }
    bar.hidden = false;
    var txt = C.BUILD[p.type].name + (p.valid === false ? " — " + (p.reason || "Can't place here") : ""), lab = $("placeLabel");
    if (lab.textContent !== txt) { lab.textContent = txt; lab.className = p.valid === false ? "warnText" : ""; }
    var ok = $("placeOk"); if (ok) ok.disabled = p.valid === false;
  };

  UI.refreshAll = function () { UI.hud(); UI.quests(); UI.refreshSheet(); };
})();

</script>
<script>
/* MONSTERHAVEN main: boot, game loop, input wiring. */
(function () {
  "use strict";
  var MH = window.MH, C = MH.C, S = MH.Sim, W = MH.World, AI = MH.AI, Rd = MH.Renderer, UI = MH.UI, Raid = MH.Raid;
  function $(id) { return document.getElementById(id); }

  var lastBuildCat = "town", lastMonFilter = "all", rotFlag = false;

  function doAction(act, ds) {
    switch (act) {
      case "tab-build": UI.openTab("build", { cat: lastBuildCat }); break;
      case "tab-monsters": UI.openTab("monsters", { filter: lastMonFilter }); break;
      case "tab-humans": UI.openTab("humans"); break;
      case "tab-military": UI.openTab("military"); break;
      case "tab-research": UI.openTab("research"); break;
      case "quest-open": UI.openTab("quests"); break;
      case "sheet-close": UI.closeSheet(); break;
      case "close-modal": UI.closeModal(); break;
      case "build-cat": lastBuildCat = ds.cat; UI.openTab("build", { cat: ds.cat }); break;
      case "build-pick": startPlacement(ds.type); break;
      case "place-rotate": { rotFlag = !rotFlag; var pm = Rd.getPlaceMode(); if (pm) pm.rot = rotFlag; break; }
      case "place-cancel": Rd.setPlaceMode(null); UI.placeBar(null); break;
      case "place-confirm": onMapPlace(); break;
      case "tab-settings": UI.openTab("settings"); break;
      case "save-now": S.save(); UI.toast("Saved"); break;
      case "export-save": copySave(); break;
      case "import-save": pasteSave(); break;
      case "raid-auto": UI.autoPick(ds.t); break;
      case "mon-filter": lastMonFilter = ds.f; UI.openTab("monsters", { filter: ds.f }); break;
      case "recruit": { var r = S.recruit(ds.sp); UI.toast(r.ok ? "Recruited!" : r.msg, !r.ok); UI.refreshAll(); break; }
      case "open-ent": UI.openEnt(parseInt(ds.id, 10)); break;
      case "assign": { var r2 = S.assign(parseInt(ds.m, 10), parseInt(ds.b, 10)); if (!r2.ok) UI.toast(r2.msg, true); UI.refreshAll(); break; }
      case "unassign": { var m = S.ent(parseInt(ds.m, 10)); if (m) S.unassign(m); UI.refreshAll(); break; }
      case "dismiss": UI.confirm("Dismiss this monster? This can't be undone.", '<button class="pbtn danger" data-act="dismiss-ok" data-m="' + ds.m + '">Dismiss</button>'); break;
      case "dismiss-ok": S.dismiss(parseInt(ds.m, 10)); UI.closeModal(); UI.closeSheet(); UI.refreshAll(); break;
      case "evolve": { var r3 = S.evolve(parseInt(ds.m, 10)); if (!r3.ok) UI.toast(r3.msg, true); else UI.toast("Evolved!"); UI.refreshAll(); break; }
      case "equip": S.equip(parseInt(ds.m, 10), parseInt(ds.i, 10)); UI.refreshAll(); break;
      case "unequip": S.unequip(parseInt(ds.m, 10), ds.slot); UI.refreshAll(); break;
      case "open-bld": UI.openBld(parseInt(ds.id, 10)); break;
      case "upgrade": { var r5 = S.upgrade(S.bld(parseInt(ds.b, 10))); if (!r5.ok) UI.toast(r5.msg, true); else UI.toast("Upgraded!"); UI.refreshAll(); break; }
      case "move-bld": startMove(parseInt(ds.b, 10)); break;
      case "remove-bld": UI.confirm("Remove this building? Half the cost is refunded.", '<button class="pbtn danger" data-act="remove-ok" data-b="' + ds.b + '">Remove</button>'); break;
      case "remove-ok": { var rb = S.remove(S.bld(parseInt(ds.b, 10))); if (!rb.ok) UI.toast(rb.msg, true); UI.closeModal(); UI.closeSheet(); UI.refreshAll(); break; }
      case "craft": { var r6 = S.craft(ds.slot, parseInt(ds.t, 10)); if (!r6.ok) UI.toast(r6.msg, true); else UI.toast("Crafted!"); UI.refreshAll(); break; }
      case "trade": { var r7 = S.trade(ds.res, ds.side); UI.toast(r7.ok ? r7.msg : r7.msg, !r7.ok); UI.refreshAll(); break; }
      case "research": { var r8 = S.startResearch(ds.id); if (!r8.ok) UI.toast(r8.msg, true); UI.refreshAll(); break; }
      case "claim": { var r9 = S.claim(ds.q); if (!r9.ok) UI.toast(r9.msg, true); else UI.toast("Reward claimed!"); UI.refreshAll(); break; }
      case "raid-open": UI.openCamp(ds.t); break;
      case "raid-back": UI.openTab("military"); break;
      case "raid-pick": UI.togglePick(ds.m); break;
      case "raid-send": { var r10 = UI.sendRaid(ds.t); UI.toast(r10.ok ? "Squad sent!" : r10.msg, !r10.ok); UI.openTab("military"); UI.refreshAll(); break; }
      case "recall": Raid.recall(parseInt(ds.e, 10)); UI.refreshAll(); break;
      case "report-open": UI.openReport(parseInt(ds.r, 10)); break;
      case "speed": setSpeed(parseInt(ds.v, 10)); break;
      case "pause": togglePause(); break;
      case "tut-next": tutorialNext(); break;
      case "center": Rd.centerOnCastle(); break;
      case "wipe": UI.confirm("Erase your kingdom and start a new game? This cannot be undone.", '<button class="pbtn danger" data-act="wipe-ok">Erase</button>'); break;
      case "wipe-ok": S.wipe(); location.reload();
    }
  }

  function startPlacement(type) {
    UI.closeSheet(); rotFlag = false;
    Rd.setPlaceMode({ type: type, rot: false });
    UI.placeBar({ type: type });
  }
  function startMove(bid) {
    var b = S.bld(bid);
    UI.closeSheet(); rotFlag = !!b.rot;
    Rd.setPlaceMode({ type: b.type, rot: !!b.rot, movingId: bid, moving: b });
    UI.placeBar({ type: b.type });
  }
  function onMapTap(sel) {
    if (!sel) { UI.closeSheet(); return; }
    if (sel.type === "ent") UI.openEnt(sel.id);
    else if (sel.type === "bld") UI.openBld(sel.id);
    else if (sel.type === "camp") UI.openCamp(sel.id);
  }
  function onMapPlace() {
    var pm = Rd.getPlaceMode(); if (!pm || !pm.at || pm.valid === false) return;
    if (pm.movingId) {
      var r = S.move(pm.moving, pm.at[0], pm.at[1], pm.rot);
      if (r.ok) { UI.toast("Moved"); Rd.setPlaceMode(null); UI.placeBar(null); UI.refreshAll(); } else UI.toast(r.msg, true);
    } else {
      var r2 = S.place(pm.type, pm.at[0], pm.at[1], pm.rot);
      if (r2.ok) { UI.toast(C.BUILD[pm.type].name + " built!"); Rd.setPlaceMode(null); UI.placeBar(null); UI.refreshAll(); }
      else UI.toast(r2.msg, true);
    }
  }

  function copySave() {
    var txt = S.exportSave();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { UI.toast("Save copied to clipboard"); }, function () { UI.toast("Clipboard blocked by the browser", true); });
    else UI.toast("Clipboard not available here", true);
  }
  function pasteSave() {
    if (!navigator.clipboard || !navigator.clipboard.readText) { UI.toast("Clipboard not available here", true); return; }
    navigator.clipboard.readText().then(function (t) {
      if (S.importSave(t)) { UI.toast("Save loaded, restarting..."); setTimeout(function () { location.reload(); }, 400); }
      else UI.toast("That doesn't look like a Monsterhaven save", true);
    }, function () { UI.toast("Clipboard blocked by the browser", true); });
  }

  /* credit time spent away: at boot, and when the tab or app comes back to the front */
  function catchUp(sec) {
    if (sec <= 20 || S.G.paused) return;
    var rep = S.offline(sec);
    AI.reset();
    if (Object.keys(rep.gross).length || rep.events.length) UI.offlineModal(rep);
  }

  function setSpeed(v) { S.G.speed = v; UI.hud(); }
  function togglePause() { S.G.paused = !S.G.paused; UI.hud(); }

  function tutorialNext() {
    var G = S.G;
    if (G.tut < C.TUTORIAL.length - 1) { G.tut++; var s = C.TUTORIAL[G.tut]; UI.tutorialModal(G.tut, C.TUTORIAL.length, s[0], s[1]); }
    else { G.tutDone = true; UI.closeModal(); S.save(); }
  }
  function startTutorial() { S.G.tut = 0; var s = C.TUTORIAL[0]; UI.tutorialModal(0, C.TUTORIAL.length, s[0], s[1]); }

  var cv, raf, last = 0, autosaveT = 0, sheetPoll = 0;

  function boot() {
    cv = $("gameCanvas");
    Rd.init(cv);
    var loaded = S.hasSave() && S.load();
    if (!loaded) S.newGame();
    W.rebuildOcc(S.G.buildings); AI.reset(); S.recompute();
    Rd.centerOnCastle();
    Rd.setHandlers({ tap: onMapTap, place: onMapPlace });
    wireButtons(); buildTabBar();
    if (!S.G.tutDone) startTutorial();
    else {
      catchUp(Math.max(0, (Date.now() - S.G.saved) / 1000));
    }
    UI.refreshAll();
    last = performance.now();
    raf = requestAnimationFrame(loop);
  }

  function wireButtons() {
    document.body.addEventListener("click", function (e) {
      var t = e.target.closest("[data-act]"); if (!t) return;
      doAction(t.dataset.act, t.dataset);
    });
    /* checkbox 'change' is covered by the click delegation above; no separate handler needed */
  }
  function buildTabBar() {
    var bar = $("tabBar");
    [["build", "Build"], ["monsters", "Monsters"], ["humans", "Humans"], ["military", "Military"], ["research", "Research"]].forEach(function (t) {
      var b = document.createElement("button"); b.className = "tabbtn"; b.type = "button"; b.dataset.act = "tab-" + t[0]; b.textContent = t[1];
      bar.appendChild(b);
    });
  }

  function loop(ts) {
    raf = requestAnimationFrame(loop);
    var dt = Math.min(0.25, (ts - last) / 1000); last = ts;
    UI.tickToast(dt);
    if (!S.G.paused) { var simDt = dt * S.G.speed; S.tick(simDt); AI.update(simDt); }
    S.pops.length = 0;
    Rd.frame();
    sheetPoll += dt;
    if (sheetPoll > 0.5) { sheetPoll = 0; UI.pollSheet(); }
    var pm = Rd.getPlaceMode(); if (pm) UI.placeBar({ type: pm.type, valid: pm.valid, reason: pm.reason });
    UI.hud(); UI.quests();
    autosaveT += dt; if (autosaveT >= C.AUTOSAVE) { autosaveT = 0; S.save(); }
  }

  window.addEventListener("beforeunload", function () { if (S.G) S.save(); });
  var hiddenAt = 0;
  document.addEventListener("visibilitychange", function () {
    if (!S.G) return;
    if (document.hidden) { hiddenAt = Date.now(); S.save(); }
    else if (hiddenAt) { var sec = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; last = performance.now(); catchUp(sec); UI.refreshAll(); }
  });

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
</html>
